name: Thu thap tin 21h

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC = 21:00 giờ Việt Nam
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: kcn-report
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Thu thập, phân loại, xuất PDF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py collect
      - name: Lưu báo cáo vào repo
        run: |
          git config user.name "kcn-report-bot"
          git config user.email "kcn-report-bot@users.noreply.github.com"
          git add data reports
          git commit -m "Báo cáo $(TZ=Asia/Ho_Chi_Minh date -d '+6 hours' +%F)" || echo "Không có thay đổi"
          git push
      - name: Giữ lịch chạy luôn bật (GitHub tự tắt lịch sau 60 ngày repo không hoạt động)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect.yml && gh workflow enable send.yml || true
