name: Thu thap tin 21h

on:
  # Lịch GitHub có thể trễ hoặc bỏ lượt, nên đặt thêm 2 lượt dự phòng.
  # Lượt nào chạy được trước thì làm, các lượt sau tự bỏ qua (giờ VN: 21:00, 21:40, 22:30).
  schedule:
    - cron: "0 14 * * *"
    - cron: "40 14 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

concurrency:
  group: kcn-report
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lấy bản mới nhất (lượt dự phòng cần thấy kết quả của lượt trước)
        run: git pull --ff-only origin main
      - name: Thu thập, phân loại, xuất PDF
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/main.py collect
      - name: Lưu báo cáo vào repo
        run: |
          git config user.name "kcn-report-bot"
          git config user.email "kcn-report-bot@users.noreply.github.com"
          git add data reports
          git commit -m "Báo cáo $(TZ=Asia/Ho_Chi_Minh date -d '+6 hours' +%F)" || echo "Không có thay đổi"
          for i in 1 2 3; do git push && break || (git pull --rebase origin main && sleep 5); done
      - name: Giữ lịch chạy luôn bật (GitHub tự tắt lịch sau 60 ngày repo không hoạt động)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect.yml && gh workflow enable send.yml || true
