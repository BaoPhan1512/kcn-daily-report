name: Gui bao cao 6h15

on:
  # Lịch GitHub hay trễ 10-60 phút, nên lượt đầu khởi động sớm lúc 05:40 (giờ VN) rồi tự chờ
  # đến đúng 06:15 mới gửi. Các lượt sau (06:05, 06:25, 06:50, 07:30, 08:15, 09:00, 10:00) là dự
  # phòng, chỉ gửi nếu chưa lượt nào gửi được. Lượt nào thấy tối qua chưa thu thập thì tự thu thập.
  schedule:
    - cron: "40 22 * * *"
    - cron: "5 23 * * *"
    - cron: "25 23 * * *"
    - cron: "50 23 * * *"
    - cron: "30 0 * * *"
    - cron: "15 1 * * *"
    - cron: "0 2 * * *"
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      auto:
        description: "true = lượt tự động từ bộ hẹn giờ ngoài (tự chờ đúng giờ, không chạy trùng)"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

concurrency:
  group: kcn-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lấy bản mới nhất (lượt dự phòng cần biết lượt trước đã gửi chưa)
        run: git pull --ff-only origin main
      - name: Thu thập bù nếu tối qua chưa có báo cáo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTO_RUN: ${{ inputs.auto }}
        run: python src/main.py ensure
      - name: Gửi PDF qua Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_RUN: ${{ inputs.auto }}
        run: python src/main.py send
      - name: Ghi nhận đã gửi
        run: |
          git config user.name "kcn-report-bot"
          git config user.email "kcn-report-bot@users.noreply.github.com"
          git add data reports
          git commit -m "Đã gửi báo cáo $(TZ=Asia/Ho_Chi_Minh date +%F)" || exit 0
          for i in 1 2 3; do git push && break || (git pull --rebase origin main && sleep 5); done
      - name: Chuyển tiếp sang lượt chờ mới (nếu còn lâu mới đến giờ gửi)
        if: hashFiles('.redispatch') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run send.yml --ref main -f auto=true
      - name: Giữ lịch chạy luôn bật (GitHub tự tắt lịch sau 60 ngày repo không hoạt động)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow enable collect.yml && gh workflow enable send.yml || true
