name: Gui bao cao 6h15

on:
  schedule:
    - cron: "15 23 * * *"  # 23:15 UTC = 06:15 giờ Việt Nam hôm sau
  workflow_dispatch: {}

concurrency:
  group: kcn-report
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gửi PDF qua Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py send
